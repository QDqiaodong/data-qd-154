[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-154"
version = "0.1.0"
description = "Bounded real-signal DFT with window gain and energy evidence"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
signal-spectrum = "signal_spectrum.cli:main"
signal-spectrum-workbench = "signal_spectrum.workbench.cli:main"
signal-waveform-fetch = "signal_spectrum.waveform.cli:main"
signal-waveform-device = "signal_spectrum.waveform.device_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
